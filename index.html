<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kiyoshi Tezuka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300&family=Zen+Old+Mincho:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfbf9;--ink:#141414;--soft:#7d7b76;--line:#e2e0da;--accent:#1a3d34;
  --sans:"Jost","Zen Old Mincho",sans-serif;--serif:"Zen Old Mincho","Hiragino Mincho ProN",serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);letter-spacing:.05em;
  min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;padding:44px 40px}
a{color:inherit;text-decoration:none}
.top{font-family:var(--sans);font-weight:300;font-size:15px;letter-spacing:.16em;line-height:1.4}
.top b{display:block;font-weight:400}
.top span{display:block;font-family:var(--serif);font-size:10px;letter-spacing:.5em;color:var(--soft);margin-top:9px}
main{max-width:640px;margin:60px 0}
h1{font-family:var(--sans);font-weight:200;font-size:clamp(38px,7vw,76px);line-height:1.08;letter-spacing:.02em}
h1 i{font-family:var(--serif);font-style:normal;font-size:.3em;letter-spacing:.28em;display:block;
  margin-top:22px;color:var(--soft)}
p{margin-top:32px;font-size:14.5px;line-height:2.4;color:#333;max-width:460px}
.links{margin-top:44px;display:flex;gap:28px;font-family:var(--sans);font-size:11px;letter-spacing:.24em}
.links a{border-bottom:1px solid var(--line);padding-bottom:6px;color:var(--accent);transition:border-color .4s}
.links a:hover{border-color:var(--accent)}
footer{font-family:var(--sans);font-size:10px;letter-spacing:.2em;color:var(--soft);
  border-top:1px solid var(--line);padding-top:22px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
@media(max-width:700px){body{padding:26px 20px}main{margin:44px 0}}
</style>
</head>
<body>
  <div class="top">KIYOSHI<b>TEZUKA</b><span>手塚清</span></div>
  <main>
    <h1>A quiet<br>snowscape.<i>準備中です</i></h1>
    <p>雪と風が好きです。写真を撮り、絵を描き、思いついた言葉を書きとめています。<br>サイトはただいま準備中です。しばらくお待ちください。</p>
    <div class="links">
      <a href="https://note.com/kt_kojin1984" target="_blank" rel="noopener">NOTE →</a>
    </div>
  </main>
  <footer><span>© 2026 KIYOSHI TEZUKA</span><span>kiyoshitezuka.com</span></footer>
</body>
</html>
